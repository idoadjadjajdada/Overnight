<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>overnight</title>
<style>
:root{
  --bg:#ffffff; --fg:#0f1419; --dim:#536471; --line:#eff3f4; --hover:#f7f9f9; --chip:#eff3f4;
  --blue:#1d9bf0; --blue-ink:#ffffff; --pink:#f91880; --green:#00ba7c; --sheet:rgba(0,0,0,.4);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --fg:#e7e9ea; --dim:#8b9199; --line:#2f3336; --hover:#080808; --chip:#202327; --sheet:rgba(91,112,131,.4); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#000000; --fg:#e7e9ea; --dim:#8b9199; --line:#2f3336; --hover:#080808; --chip:#202327; --sheet:rgba(91,112,131,.4); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 53px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.3125 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.col{max-width:600px;margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
@media (max-width:600px){.col{border:0}}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .row{height:53px;display:flex;align-items:center;gap:24px;padding:0 16px}
.bar h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;flex:1}
.bar .sub{font-size:13px;color:var(--dim);font-weight:400}
.wordmark{flex:1;text-align:center;font-weight:800;font-size:19px;letter-spacing:-.03em}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.iconbtn:hover{background:var(--hover)}
.seg{display:flex}
.seg button{flex:1;height:53px;color:var(--dim);font-weight:500;position:relative}
.seg button[aria-selected="true"]{color:var(--fg);font-weight:700}
.seg button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:4px;border-radius:2px;background:var(--blue)}

.ic{width:18.75px;height:18.75px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--chip);display:block}
.av.s{width:32px;height:32px}.av.xl{width:80px;height:80px;border:4px solid var(--bg)}
.vf{width:18px;height:18px;flex:none;color:var(--blue);margin-left:2px}
.nm{display:flex;align-items:center;min-width:0;gap:4px}
.nm b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .h{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--dim)}

.tw{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.tw:hover{background:var(--hover)}
.tw .b{flex:1;min-width:0}
.tw .t{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rto{color:var(--dim);margin-top:2px}.rto span{color:var(--blue)}
.acts{display:flex;justify-content:space-between;max-width:425px;margin-top:10px;color:var(--dim)}
.act{display:flex;align-items:center;gap:4px;font-size:13px;min-width:0}
.act .ic{flex:none}
.act:hover{color:var(--blue)}
.act.like:hover,.act.like.on{color:var(--pink)}
.act.rt:hover,.act.rt.on{color:var(--green)}
.act.like.on .ic{fill:var(--pink)}
.act.bm.on{color:var(--blue)}.act.bm.on .ic{fill:var(--blue)}

.main{padding:12px 16px 0}
.main .top{display:flex;gap:12px;align-items:center}
.main .t{font-size:17px;line-height:1.35;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{color:var(--dim);padding-bottom:16px;border-bottom:1px solid var(--line)}
.meta b{color:var(--fg)}
.why{color:var(--dim);font-size:13px;margin:8px 0 12px}
.counts{display:flex;flex-wrap:wrap;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.counts b{color:var(--fg)}
.bigacts{display:flex;justify-content:space-around;padding:10px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.bigacts .ic{width:22px;height:22px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

.rbox{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.rbox textarea{flex:1;border:0;background:none;resize:none;font-size:17px;outline:none;padding:8px 0;min-height:40px}
.rbox .who-to{font-size:13px;color:var(--dim);margin:6px 0 0}
.rbox .who-to span{color:var(--blue)}
.pill{background:var(--blue);color:var(--blue-ink);border-radius:999px;padding:0 16px;height:36px;font-weight:700}
.pill:disabled{opacity:.5;cursor:default}
.pill.dark{background:var(--fg);color:var(--bg)}
.pill.out{background:none;color:var(--fg);border:1px solid var(--line)}
.pill.sm{height:32px;font-size:14px}
.pill.danger{background:none;border:1px solid var(--line);color:var(--pink)}

.fab{position:fixed;right:max(16px,calc(50% - 300px + 16px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 12px rgba(29,155,240,.25);z-index:7}
.fab .ic{width:24px;height:24px;stroke-width:2.4}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:600px;margin:0 auto;display:flex;justify-content:space-around;height:53px}
.nav button{flex:1;display:grid;place-items:center;position:relative}
.nav .ic{width:26px;height:26px;stroke-width:1.7}
.nav button[aria-current="page"] .ic{stroke-width:2.6}
.badge{position:absolute;top:6px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}

.nt{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.nt:hover{background:var(--hover)}
.nt .kind{width:40px;display:flex;justify-content:flex-end;flex:none}
.nt .kind .ic{width:28px;height:28px}
.nt .faces{display:flex;gap:4px;margin-bottom:8px}
.nt p{margin:0}
.nt .snip{color:var(--dim);margin-top:6px;overflow-wrap:anywhere}

.person{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.person:hover{background:var(--hover)}
.person .b{flex:1;min-width:0}
.fy{display:inline-block;background:var(--chip);color:var(--dim);font-size:12px;border-radius:4px;padding:1px 4px;margin-left:4px}
.bio{margin:4px 0 0;overflow-wrap:anywhere}
.rel{font-size:13px;margin-top:6px;display:flex;gap:8px;align-items:center;color:var(--dim)}
.meter{position:relative;width:80px;height:4px;border-radius:2px;background:var(--chip)}
.meter i{position:absolute;top:0;bottom:0;border-radius:2px}

.banner{height:150px}
.prof{padding:0 16px 12px;border-bottom:1px solid var(--line)}
.prof .r1{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-44px}
.prof .r1 .btns{display:flex;gap:8px;padding-bottom:4px}
.prof h2{font-size:20px;font-weight:800;margin:8px 0 0;display:flex;align-items:center;gap:2px}
.prof .h{color:var(--dim)}
.prof .bio{margin:12px 0}
.prof .joined{color:var(--dim);display:flex;gap:6px;align-items:center}
.prof .ff{display:flex;gap:20px;margin-top:10px;color:var(--dim)}
.prof .ff b{color:var(--fg)}
.memline{margin:10px 0 0;color:var(--dim)}

.sheetwrap{position:fixed;inset:0;z-index:20;background:var(--sheet);display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.sheet{background:var(--bg);width:100%;max-width:600px;min-height:100%;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:640px){.sheetwrap{padding:5vh 0}.sheet{min-height:0;border-radius:16px}}
.sheet .hd{display:flex;align-items:center;gap:16px;height:53px;padding:0 16px}
.sheet .hd h3{flex:1;margin:0;font-size:20px;font-weight:800}
.composer{display:flex;gap:12px;padding:4px 16px 16px}
.composer textarea{flex:1;border:0;background:none;resize:none;font-size:20px;line-height:1.3;min-height:140px;outline:none;padding:8px 0}
.composer textarea::placeholder,.rbox textarea::placeholder{color:var(--dim)}
.cfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.ring{width:22px;height:22px}
.field{margin:0 16px 16px;border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.field label{display:block;font-size:13px;color:var(--dim)}
.field input,.field textarea,.field select{width:100%;border:0;background:none;outline:none;padding:2px 0;font-size:17px}
.field textarea{resize:vertical;min-height:72px}
.hint{margin:-8px 16px 16px;font-size:13px;color:var(--dim)}
.chk{display:flex;align-items:center;gap:10px;margin:0 16px 16px}
.photo{position:relative;display:inline-block;margin:0 16px 16px}
.photo .over{position:absolute;inset:4px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.stack{display:flex;flex-direction:column;gap:10px;padding:0 16px 20px}
.stack .pill{align-self:flex-start}
.empty{padding:32px 32px;max-width:400px;margin:0 auto}
.empty h2{font-size:31px;font-weight:800;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.empty p{color:var(--dim);margin:0 0 24px}
.note{color:var(--dim);font-size:13px;padding:12px 16px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blue);color:#fff;padding:12px 16px;border-radius:4px;font-size:15px;max-width:calc(100% - 32px);z-index:30;display:none}
@media (prefers-reduced-motion: reduce){.live-dot{animation:none}}
.newr{animation:in .3s ease-out}
@keyframes in{from{background:color-mix(in srgb,var(--blue) 10%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion: reduce){.newr{animation:none}}

.fab[hidden]{display:none}
.avcol{display:flex;flex-direction:column;align-items:center;flex:none}
.ln{flex:1;width:2px;background:var(--line);margin-top:4px;margin-bottom:-16px;border-radius:1px;min-height:12px}
.tw.lined,.tw.nb{border-bottom:0}
.tw.cont{padding-top:4px}
.more{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px 14px;border-bottom:1px solid var(--line);color:var(--blue);text-align:left}
.more .dots{width:40px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.more .dots i{width:2px;height:3px;background:var(--line);border-radius:1px}
.more:hover span{text-decoration:underline}
.extend{padding:16px;border-bottom:1px solid var(--line)}
.focus{padding:4px 16px 0}
.focus .t{font-size:17px;line-height:1.35;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.nml{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.nml:hover b{text-decoration:underline}
.avbtn{flex:none;border-radius:50%;display:block}
.tw.static{cursor:default}.tw.static:hover{background:none}
.infos{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--dim)}
.infos span{display:flex;gap:4px;align-items:center}
.skel{padding:16px;color:var(--dim)}
.label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;font-weight:700;padding:10px 16px 0 44px;margin-bottom:-6px}
.label .ic{width:15px;height:15px}

.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe>.tw{border-bottom:0;background:var(--bg);position:relative;z-index:1;touch-action:pan-y;transition:transform .2s ease}
.swipe>.tw.dragging{transition:none}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:96px;background:#f4212e;color:#fff;font-weight:700;display:grid;place-items:center;z-index:0}

.quote{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;cursor:pointer}
.quote .qh{display:flex;align-items:center;gap:6px;font-size:14px}
.quote .qh img{width:20px;height:20px;border-radius:50%}
.quote p{margin:4px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.cnote{border:1px solid var(--line);border-radius:16px;margin:10px 0 4px;overflow:hidden}
.cnote .ch{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-weight:700}
.cnote .ch .ic{width:18px;height:18px;color:var(--blue)}
.cnote p{margin:6px 12px 12px;overflow-wrap:anywhere}
.cnote .cf{border-top:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--dim)}

.newpill{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);z-index:5;display:flex;justify-content:center;height:0}
.newpill button{display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-top:10px}
.newpill img{width:22px;height:22px;border-radius:50%;border:2px solid var(--blue);margin-right:-10px}
.newpill span{margin-left:12px}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--dim);font-size:13px;transition:height .2s}
.loadrow{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;color:var(--dim)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--blue);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.5s}}

.search{padding:6px 16px 8px}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid transparent;background:var(--chip);padding:0 16px;font-size:15px;outline:none}
.search input:focus{border-color:var(--blue);background:var(--bg)}
.trend{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.trend:hover{background:var(--hover)}
.trend .c{font-size:13px;color:var(--dim)}
.trend .n{font-weight:700;margin:2px 0}
.sechead{font-size:20px;font-weight:800;padding:12px 16px;margin:0}

.dml{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.dml:hover{background:var(--hover)}
.dml .b{flex:1;min-width:0}
.dml .last{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dml.unread .last{color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);align-self:center;flex:none}
.chat{display:flex;flex-direction:column;gap:4px;padding:16px 16px 90px}
.chat .intro{text-align:center;padding:12px 0 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.chat .intro img{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:block}
.bub{max-width:78%;padding:10px 14px;border-radius:22px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.3}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
.btime{font-size:12px;color:var(--dim);margin:2px 4px 8px}
.btime.me{align-self:flex-end}
.typing{align-self:flex-start;background:var(--chip);border-radius:22px;padding:12px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-4px);opacity:.5}}
.chatbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.chatbar form{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:center}
.chatbar input{flex:1;min-width:0;height:40px;border-radius:999px;border:0;background:var(--chip);padding:0 16px;outline:none;font-size:15px}
.chatbar button{color:var(--blue);font-weight:700;padding:0 6px}
.chatbar button:disabled{opacity:.4}

.drawerwrap{position:fixed;inset:0;z-index:25;background:var(--sheet)}
.drawer{position:absolute;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;box-shadow:2px 0 20px rgba(0,0,0,.3)}
.drawer .ff{display:flex;gap:16px;margin:12px 0 16px;color:var(--dim)}
.drawer .ff b{color:var(--fg)}
.drawer .item{display:flex;align-items:center;gap:20px;width:100%;padding:14px 0;font-size:20px;font-weight:700}
.drawer .item .ic{width:24px;height:24px}
.menuwrap{position:fixed;inset:0;z-index:26;background:var(--sheet);display:flex;align-items:flex-end;justify-content:center}
.menu{background:var(--bg);width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;font-weight:700;font-size:16px}
.menu button:hover{background:var(--hover)}
.menu .cancel{justify-content:center;border:1px solid var(--line);border-radius:999px;width:calc(100% - 32px);margin:8px 16px 0}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px}
.pick:hover{background:var(--hover)}
img.sq,.av.sq,.quote .qh img.sq{border-radius:8px}

.tag{display:inline;padding:0;border:0;background:none;color:var(--blue);font:inherit;cursor:pointer}
.tag:hover,.lnk:hover{text-decoration:underline}
.lnk{color:var(--blue);text-decoration:none}
.bub.me .tag,.bub.me .lnk{color:#fff;text-decoration:underline}
.card{display:block;margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;color:#fff;text-decoration:none}
.card .cimg{position:relative;aspect-ratio:1.91/1;display:grid;place-items:center}
.card .mono{font:700 64px/1 Georgia,"Times New Roman",serif;opacity:.92}
.card .play{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.card .play svg{width:30px;height:30px;margin-left:4px}
.card .ttl{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:rgba(0,0,0,.72);color:#fff;font-size:13px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.from{font-size:13px;color:var(--dim);margin-top:4px}
.composer>div,.rbox>div,.chatbar form{position:relative}
.mbox{position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-height:280px;overflow:auto;padding:4px 0}
.chatbar .mbox{top:auto;bottom:calc(100% + 8px)}
.chint{display:flex;flex-wrap:wrap;gap:6px 10px;padding:0 16px 12px 68px;font-size:13px;color:var(--blue)}
.chint:empty{display:none}
.chint em{font-style:normal;color:var(--dim)}
.chint .card,.chint .from{flex-basis:100%}

:root[data-theme="dim"]{ --bg:#15202b; --fg:#f7f9f9; --dim:#8b98a5; --line:#38444d; --hover:#1e2732; --chip:#273340; --sheet:rgba(91,112,131,.4); color-scheme:dark; }
.pimgbtn{display:block;width:100%;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.pimg{display:block;width:100%;max-height:520px;object-fit:cover}
.poll{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.popt{border:1px solid var(--blue);color:var(--blue);border-radius:999px;height:34px;font-weight:700}
.popt:hover{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.pres{position:relative;display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 10px;border-radius:6px;overflow:hidden}
.pres i{position:absolute;left:0;top:0;bottom:0;background:var(--chip);border-radius:6px}
.pres.win i{background:color-mix(in srgb,var(--blue) 45%,transparent)}
.pres span,.pres b{position:relative;display:flex;align-items:center;gap:6px}
.pres.win span,.pres.win b{font-weight:700}
.pchk{width:16px;height:16px;stroke-width:2.6}
.pfoot{color:var(--dim);font-size:14px}
.edited{color:var(--dim);font-size:13px;margin-top:4px}
.scopebar{display:flex;gap:6px;align-items:center;color:var(--blue);font-size:13px;margin:8px 0 12px}
.scopebar .ic{width:16px;height:16px}
.ic.sm{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.cimg2{position:relative;margin-top:8px;border-radius:16px;overflow:hidden}
.cimg2 img{display:block;width:100%;max-height:360px;object-fit:cover}
.cimg2 .rm{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(15,20,25,.75);color:#fff;font-size:22px;line-height:1}
.polled{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.polled .field{margin-left:0;margin-right:0}
.pollrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;font-size:14px;color:var(--dim)}
.pollrow select{margin-left:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px}
.link2{color:var(--blue);font-weight:700;padding:4px 0}
.link2.danger,.dangertxt{color:#f4212e}
.hd .link2{margin-right:4px}
.scope{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;font-size:14px;padding:0 16px 12px 68px}
.scope .ic{width:16px;height:16px}
.tools{display:flex;gap:4px;color:var(--blue)}
.tools .ic{width:20px;height:20px}
.tool:disabled{opacity:.4;cursor:default}
.cfoot{justify-content:flex-start}
.mtitle{font-weight:800;font-size:20px;margin:8px 20px 4px}
.msub{color:var(--dim);margin:0 20px 8px}
.menu .mchk{margin-left:auto;color:var(--blue)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.lightbox img{max-width:100%;max-height:90vh;border-radius:6px}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:24px}
.banner{position:relative}
.bdots{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
@media (min-width:520px){.stats4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat span{color:var(--dim);font-size:13px}
.chartwrap{padding:0 16px 12px;border-bottom:1px solid var(--line)}
.chart{width:100%;height:auto;display:block}
.chart .cl{fill:var(--dim);font-size:12px}
/* never let iOS auto-zoom: every text control is at least 16px */
input,textarea,select{font-size:16px!important}
.composer textarea{font-size:20px!important}.rbox textarea{font-size:17px!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}

.tpart{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.tpart .t{margin:0 0 4px}
.showthread{color:var(--blue);font-size:14px;margin-top:6px}
.tpartc{border-top:1px dashed var(--line);padding-top:10px}
.tpartc .iconbtn{font-size:22px;color:var(--dim)}
.ach{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.achic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#e2b719 22%,transparent);color:#e2b719;flex:none}
.ach.locked{opacity:.45}.ach.locked .achic{background:var(--chip);color:var(--dim)}
button.bub{font:inherit;text-align:left;border:0;cursor:pointer}
.bub.me{color:#fff}.bub.them{color:var(--fg)}
.react{align-self:flex-start;margin:-6px 0 4px 10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 6px;font-size:12px;display:flex;align-items:center;gap:2px;color:var(--pink)}
.react.me{align-self:flex-end;margin:-6px 10px 4px 0}
.react .hr{width:13px;height:13px;fill:var(--pink);stroke:var(--pink)}

.cropwrap{display:flex;justify-content:center;padding:12px 16px 4px}
#cropCv{width:280px;height:280px;border-radius:12px;background:#000;touch-action:none;cursor:grab}
#cropCv:active{cursor:grabbing}
.cropzoom{display:flex;align-items:center;gap:12px;padding:8px 24px;color:var(--dim)}
.cropzoom input{flex:1;accent-color:var(--blue)}
.dbg{margin:0 16px 16px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--dim)}
.dbg summary{cursor:pointer;font-weight:700;color:var(--fg)}
.dbg pre{white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;background:var(--chip);padding:8px;border-radius:6px;font-size:12px}
#toast{display:none;align-items:center;gap:16px}
#toast button{color:#fff;font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<div class="col" id="app"></div>
<button class="fab" id="fab" aria-label="Post"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" aria-label="Main"><div class="in" id="nav"></div></nav>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept="image/*" hidden>
<div id="drawer"></div><div id="menu"></div>

/* ================= rich text: #tags, @mentions, links ================= */
const TOKEN = /(https?:\/\/[^\s<]+|www\.[^\s<]+|\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|io|co|gg|tv|me|app|dev|ly|us|uk|ca|xyz|ai|fm|news)(?:\/[^\s<]*)?|#(?=[\p{N}_]*\p{L})[\p{L}\p{N}_]+|@[A-Za-z0-9_]{1,24})/giu;

function resolveHandle(h){
  h = String(h).toLowerCase(); if (h === S.profile.handle.toLowerCase()) return 'me';
  const c = S.cast.find(x => x.handle.toLowerCase() === h); if (c) return c.id;
  const n = S.news.concat(S.companies).find(x => x.handle.toLowerCase() === h); if (n) return n.id;
  return 'h:' + h;
}
function rich(text){
  let out = '', last = 0; const t = String(text ?? '');
  t.replace(TOKEN, (m, _g, idx) => {
    out += esc(t.slice(last, idx)); last = idx + m.length;
    if (m[0] === '#'){ out += `<button class="tag" data-tag="${esc(m)}">${esc(m)}</button>`; return m; }
    if (m[0] === '@'){ out += `<button class="tag" data-mention="${esc(m.slice(1))}">${esc(m)}</button>`; return m; }
    const [u, tail] = splitUrl(m);
    out += `<a class="lnk" href="${esc(href(u))}" target="_blank" rel="noopener noreferrer">${esc(shortUrl(u))}</a>${esc(tail)}`; return m;
  });

}
function linkInfo(u){

  const seg = url.pathname.split('/').filter(Boolean).pop() || '';
  let title = decodeURIComponent(seg).replace(/\.[a-z0-9]{2,5}$/i, '').replace(/[-_+]+/g, ' ').replace(/\b[0-9a-f]{8,}\b/gi, '').trim();
  if (!title || /^\d+$/.test(title) || title.length < 3) title = '';

  if (!title){ const base = dom.split('.').slice(-2, -1)[0] || dom; title = base.charAt(0).toUpperCase() + base.slice(1); }

function cardFor(text){

function linkLine(text){ const us = urlsIn(text); return us.length ? `\nLINKS IN IT: ${us.join(', ')}. Nobody can open links here: react to what the link obviously is from its address, and don't invent its contents.` : ''; }

function displayTagFrom(text, tag){ return (String(text).match(/#(?=[\p{N}_]*\p{L})[\p{L}\p{N}_]+/gu) || []).find(x => x.toLowerCase() === tag) || tag; }

function sparkline(pts, h = 140){

  const X = x => 8 + (x - x0) / ((x1 - x0) || 1) * (W - 16), Y = y => h - 20 - (y - y0) / ((y1 - y0) || 1) * (h - 40);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Follower growth from ${fmt(y0)} to ${fmt(y1)}"><path d="${d} L${X(x1)} ${h - 20} L${X(x0)} ${h - 20}Z" fill="var(--blue)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/><text x="8" y="14" class="cl">${fmt(y1)}</text><text x="8" y="${h - 4}" class="cl">${fmt(y0)}</text></svg>`;
}
function bars(list, h = 150){

let sw = null, suppressClick = false;
function closeSwipes(except){ document.querySelectorAll('.swipe > .tw.open').forEach(el => { if (el !== except){ el.classList.remove('open'); el.style.transform = ''; } }); }
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.del')) return;
  const el = e.target.closest('.swipe > .tw'); closeSwipes(el);
  if (!el || e.button > 0) return;
  sw = {el, x: e.clientX, y: e.clientY, base: el.classList.contains('open') ? -96 : 0, dx: 0, active: false, id: e.pointerId};
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.active){
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3){ sw.active = true; sw.el.classList.add('dragging'); try{ sw.el.setPointerCapture(e.pointerId); }catch(err){} }
    else if (Math.abs(dy) > 10){ sw = null; return; } else return;
  }
  sw.dx = Math.min(0, Math.max(-150, sw.base + dx)); sw.el.style.transform = `translateX(${sw.dx}px)`;
});
function endSwipe(){
  if (!sw) return; const s = sw; sw = null; if (!s.active) return;
  s.el.classList.remove('dragging');
  if (s.dx < -130){ const ref = s.el.parentElement.querySelector('.del').dataset.del; s.el.style.transform = 'translateX(-100%)'; setTimeout(() => deleteThing(ref), 180); }
  else { const open = s.dx < -48; s.el.classList.toggle('open', open); s.el.style.transform = open ? 'translateX(-96px)' : ''; }
  suppressClick = true; setTimeout(() => suppressClick = false, 60);
}

    const handle = ($('#c-handle').value.trim().replace(/^@/, '').replace(/\s+/g, '') || name.toLowerCase().replace(/[^a-z0-9_]/g, '')).slice(0, 24) || 'user' + Math.floor(Math.random() * 9999);
    if (org){
      const list = kind === 'news' ? S.news : S.companies;
      if (!persona) persona = kind === 'news' ? `News outlet called ${name}. Covers whatever its name suggests, in a matching style.` : `Brand account for ${name}. Plays it the way the name suggests: if it's a pun on a real company, a playful parody of that company's public image.`;
      if (sheet.id){ Object.assign(newsById(sheet.id), {name, handle, persona, badge}); delete U[sheet.id]; delete genErr[sheet.id]; Store.del('u_' + safe(sheet.id)); }
      else list.push({id: (kind === 'news' ? 'n' : 'b') + uid(), name, handle, persona, badge});
      kind === 'news' ? saveNews() : saveCompanies();
    } else {
      const verified = badge || false, rel = RELS.find(r => String(r[0]) === $('#c-rel').value) || RELS[2];
      if (!persona) persona = `Play ${name} the way the name suggests: if it's a known public figure, a playful parody of their public persona; otherwise a believable personality that fits the name.`;
      if (sheet.id){ const c = castById(sheet.id), relChanged = rel !== RELS.reduce((best, r) => Math.abs(r[0] - (c.feeling || 0)) < Math.abs(best[0] - (c.feeling || 0)) ? r : best, RELS[2]);
        Object.assign(c, {name, handle, persona, verified}); if (relChanged){ c.feeling = rel[0]; c.note = rel[2]; } delete U[sheet.id]; delete genErr[sheet.id]; Store.del('u_' + safe(sheet.id)); }
      else S.cast.unshift({id: 'c' + uid(), name, handle, persona, verified, feeling: rel[0], note: rel[2], opinions: [], added: Date.now()});
      saveCast();
    }
    sheet = null; renderSheet(); render(); toast(kind === 'news' ? `${name} is on the news beat` : kind === 'company' ? `${name} has entered the timeline` : `${name} is in your cast. They'll show up on your next post.`); return;
  }
  if (t.dataset.resetrel){
    const c = castById(t.dataset.resetrel); if (!c) return; Object.assign(c, {feeling: 0, note: '', blocked: false});
    if (S.dms[c.id]){ S.dms[c.id].blocked = false; saveDm(c.id); } saveCast(); sheet = null; renderSheet(); render(); toast(`Fresh start with ${c.name}`); return;
  }
  if (t.dataset.removechar){
    const c = castById(t.dataset.removechar) || newsById(t.dataset.removechar); if (!c || !confirm(`Remove ${c.name}?`)) return;
    S.cast = S.cast.filter(x => x.id !== c.id); S.news = S.news.filter(x => x.id !== c.id); S.companies = S.companies.filter(x => x.id !== c.id); saveNews(); saveCompanies(); delete S.photos[c.id]; Store.del('av_' + c.id); saveCast(); sheet = null; renderSheet(); stack = []; go({tab: 'cast', view: null}, false); return;
  }
  const w = t.dataset.wipe;
  if (w === 'feed'){ if (!confirm('Delete every post of yours and reset followers?')) return; S.posts.forEach(p => Store.del(p.id)); S.posts = []; S.profile.followers = 212; S.profile.pinned = ''; saveProfile(); }
  if (w === 'timeline'){ if (!confirm("Clear everyone else's posts and the trends?")) return; S.feed = []; S.trends = []; saveFeed(); }
  if (w === 'dms'){ if (!confirm('Delete all messages?')) return; Object.keys(S.dms).forEach(k => Store.del('dm_' + safe(k))); S.dms = {}; }
  if (w === 'cast'){ if (!confirm('Replace your cast with the original characters? Characters you added will be removed.')) return; Object.keys(S.photos).forEach(k => Store.del('av_' + k)); S.photos = {}; S.cast = fresh(); S.news = freshNews(); S.companies = freshCompanies(); saveCast(); saveNews(); saveCompanies(); }
  if (w){ sheet = null; renderSheet(); stack = []; route = {tab: 'home', view: null}; render(); toast('Done'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (sheet){ sheet = null; renderSheet(); } else if (menu){ menu = null; renderMenu(); } else if (drawer){ drawer = false; renderDrawer(); } }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ if (e.target.id === 'composeText') $('#sendPost').click(); if (e.target.id === 'replyInput') e.target.form.requestSubmit(); }
});
$('#app').addEventListener('input', e => { if (e.target.id === 'searchInput'){ query = e.target.value; $('#results').innerHTML = exploreResults(); } });
$('#app').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.replyform){
    const p = getPost(f.dataset.replyform), val = $('#replyInput').value; if (!p || !val.trim()) return;
    if (p.live){ toast('Wait for the replies to land first.'); return; } if (working.has(p.id)){ toast('Replies are still coming in.'); return; }
    const target = (replyTo && replyTo.post === p.id && replyTo.reply) || f.dataset.default || null;
    $('#replyInput').value = ''; doReply(p, target, val); return;
  }
  if (f.dataset.dmform){ const k = f.dataset.dmform, val = $('#dmInput').value; if (!val.trim() || dmBusy[k]) return; $('#dmInput').value = ''; sendDm(k, val); return; }
  if (f.hasAttribute('data-searchform')){ const i = $('#searchInput'); if (i) i.blur(); }
});
$('#app').addEventListener('click', e => {
  if (suppressClick){ e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.closest('a[href]')) return;
  const openRow = e.target.closest('.swipe > .tw.open'); if (openRow && !e.target.closest('.del')){ closeSwipes(); return; }
  const t = e.target.closest('button, [data-open], [data-user], [data-reply], [data-qopen], [data-go-me]'); if (!t) return;
  const d = t.dataset;
  if (t.matches('button')){
    if ('back' in d){ back(); return; }
    if (d.vote){ e.stopPropagation(); const [pid, i] = d.vote.split('|'), p = getPost(pid); if (p && p.poll && p.poll.voted == null){ p.poll.voted = +i; if (!p.poll.votes) p.poll.votes = normVotes(null, p.poll.options.length); savePost(p); render(); } return; }
    if (d.lightbox){ e.stopPropagation(); const p = getPost(d.lightbox); if (p && p.image){ menu = {type: 'image', src: p.image}; renderMenu(); } return; }
    if (d.usermenu){ e.stopPropagation(); menu = {type: 'user', key: d.usermenu}; renderMenu(); return; }
    if (d.block){ const k = d.block; S.profile.blocks = (S.profile.blocks || []).filter(x => x !== k); saveProfile(); render(); toast(`Unblocked @${acct(k).handle}`); return; }
    if (d.tag){ e.stopPropagation(); openTag(d.tag); return; }
    if (d.mention){ e.stopPropagation(); openUser(resolveHandle(d.mention)); return; }
    if (d.del){ e.stopPropagation(); deleteThing(d.del); return; }
    if (d.user){ e.stopPropagation(); openUser(d.user); return; }
    if ('drawer' in d){ drawer = true; renderDrawer(); return; }
    if ('refresh' in d || 'loadfeed' in d){ loadTimeline(); return; }
    if ('seenew' in d){ newPill = null; scrollTo({top: 0, behavior: 'smooth'}); render(); return; }
    if (d.hseg){ homeSeg = d.hseg; render(); return; }
    if (d.eseg){ exploreSeg = d.eseg; query = ''; render(); return; }
    if (d.utab){ if (route.view?.type === 'user') route.view.tab = d.utab; render(); return; }
    if (d.retryuser){ delete genErr[d.retryuser]; ensureUser(d.retryuser); render(); return; }
    if (d.loaduser){ ensureUser(d.loaduser); render(); return; }
    if (d.follow){ const k = d.follow; U[k] = U[k] || {key: k}; U[k].following = !U[k].following; saveUser(k); render(); toast(U[k].following ? `Following @${acct(k).handle}` : 'Unfollowed'); return; }
    if (d.dm){ openChat(d.dm); return; }
    if ('newdm' in d){ sheet = {type: 'picker', q: ''}; renderSheet(); return; }
    if (d.chat){ openChat(d.chat); return; }
    if (d.msg != null && route.view?.type === 'chat'){ menu = {type: 'msg', key: route.view.key, i: +d.msg}; renderMenu(); return; }
    if (d.trend){ query = d.trend; render(); return; }
    if (d.topic){ const tp = d.topic; loadTimeline(tp).then(() => { if (route.tab === 'explore'){ const r = $('#results'); if (r) r.innerHTML = exploreResults(); } }); const r = $('#results'); if (r) r.innerHTML = exploreResults(); return; }
    if (d.tocast){
      const k = d.tocast, a = acct(k), u = U[k] || {}, sr = repliesBy(k)[0];
      const persona = `Regular account${u.bio ? ' whose bio reads: ' + u.bio : ''}.${sr ? ' Talks like this: "' + sr[0].text + '"' : ''}`.slice(0, 400);
      const id = 'c' + uid(); S.cast.unshift({id, name: a.name, handle: a.handle, verified: a.verified, persona, feeling: u.feeling || 1, note: u.note || '', opinions: [], added: Date.now()});
      allPosts().forEach(p => { let ch = false; p.replies.forEach(r => { if (ukey(r) === k){ r.who = id; ch = true; } }); if (!isMine(p) && ukey(p.author) === k){ p.author.who = id; ch = true; } if (ch) savePost(p); });
      if (S.dms[k]){ S.dms[id] = {...S.dms[k], key: id, acct: {...S.dms[k].acct, who: id}}; delete S.dms[k]; Store.del('dm_' + safe(k)); saveDm(id); }
      if (U[k]){ U[id] = {...U[k], key: id}; saveUser(id); }
      saveCast(); route.view = {type: 'user', key: id, tab: 'posts'}; render(); toast(`${a.name} joined your cast`); return;
    }
    if ('compose' in d){ sheet = {type: 'compose'}; renderSheet(); return; }
    if (d.nf){ notifFilter = d.nf; render(); return; }
    if ('addchar' in d){ sheet = {type: 'char'}; renderSheet(); return; }
    if ('addnews' in d){ sheet = {type: 'news'}; renderSheet(); return; }
    if (d.editnews){ sheet = {type: companyById(d.editnews) ? 'company' : 'news', id: d.editnews}; renderSheet(); return; }
    if ('addcompany' in d){ sheet = {type: 'company'}; renderSheet(); return; }
    if (d.editchar){ sheet = {type: 'char', id: d.editchar}; renderSheet(); return; }
    if ('editprofile' in d){ sheet = {type: 'profile'}; renderSheet(); return; }
    if (d.photo){ pickPhoto(d.photo); return; }
    if (d.openreply){ go({tab: route.tab, view: {type: 'reply', post: d.post, id: d.openreply}}); return; }
    if (d.extend){ const p = getPost(route.view?.post); if (p) doExtend(p, d.extend); return; }
    if (d.showreplies){ const p = getPost(d.showreplies); if (p) loadOthersReplies(p); return; }
    const act = d.act; if (!act) return;
    e.stopPropagation();
    const art = t.closest('[data-reply]'), pid = (art && art.dataset.post) || t.closest('[data-open]')?.dataset.open || (route.view?.type === 'post' ? route.view.id : route.view?.type === 'reply' ? route.view.post : null);
    const p = getPost(pid);
    if (act === 'clearto'){ replyTo = null; render(); return; }
    if (act === 'focusreply'){ replyTo = null; render(); const ri = $('#replyInput'); if (ri){ ri.focus(); ri.scrollIntoView({block: 'center'}); } return; }
    if (!p) return;
    if (art){
      const r = p.replies.find(x => x.id === art.dataset.reply); if (!r) return;
      if (act === 'reply'){ const here = showing(p); if (!here) go({tab: route.tab, view: {type: 'reply', post: p.id, id: r.id}}); else { replyTo = {post: p.id, reply: r.id}; render(); } const ri = $('#replyInput'); if (ri){ ri.focus(); ri.scrollIntoView({block: 'center'}); } return; }
      if (act === 'share'){ navigator.clipboard?.writeText(r.text).then(() => toast('Copied to clipboard'), () => toast("Couldn't copy")); return; }
      if (act === 'like') r.liked = !r.liked; if (act === 'rt') r.rt = !r.rt;
      if (!p.live) savePost(p); render(); return;
    }
    if (act === 'preply'){ if (!showing(p)) go({tab: route.tab, view: {type: 'post', id: p.id}}); const ri = $('#replyInput'); if (ri){ ri.focus(); } return; }
    if (act === 'rtmenu'){ menu = {post: p.id}; renderMenu(); return; }
    if (act === 'pshare'){ navigator.clipboard?.writeText(p.text).then(() => toast('Copied to clipboard'), () => toast("Couldn't copy")); return; }
    if (act === 'pdel'){ deleteThing(p.id); return; }
    if (act === 'pedit'){ sheet = {type: 'compose', editId: p.id, draft: p.text}; renderSheet(); return; }
    if (act === 'ppin'){ S.profile.pinned = S.profile.pinned === p.id ? '' : p.id; saveProfile(); toast(S.profile.pinned ? 'Pinned to your profile' : 'Unpinned'); render(); return; }
    if (act === 'plike') p.liked = !p.liked;
    if (act === 'pbm'){ p.bm = !p.bm; toast(p.bm ? 'Added to your Bookmarks' : 'Removed from your Bookmarks'); }
    if (!p.live) savePost(p); render(); return;
  }
  if (d.qopen){ e.stopPropagation(); const qp = getPost(d.qopen); if (qp) go({tab: route.tab, view: {type: 'post', id: qp.id}}); return; }
  if (d.user){ openUser(d.user); return; }
  if ('goMe' in d){ openUser('me'); return; }
  if (d.reply && d.post){ if (route.view?.type === 'reply' && route.view.id === d.reply) return; go({tab: route.tab, view: {type: 'reply', post: d.post, id: d.reply}}); return; }
  if (d.open){ if (route.view?.type === 'post' && route.view.id === d.open) return; go({tab: route.tab, view: {type: 'post', id: d.open}}); return; }
}, true);
setInterval(() => { if (!busy && !working.size && !sheet && !menu && !drawer && !sw && !document.activeElement?.matches('textarea,input')) render(); }, 60000);

/* ================= boot ================= */
async function loadAll(){
  const all = await Store.load();
  S.cast = fresh(); S.news = freshNews(); S.companies = freshCompanies(); S.photos = {}; S.dms = {}; S.feed = []; S.trends = []; for (const k in U) delete U[k];
  if (all.profile) S.profile = {...S.profile, ...all.profile};
  if (all.cast && Array.isArray(all.cast.list)) S.cast = all.cast.list.map(c => ({opinions: [], ...c}));
  if (all.news && Array.isArray(all.news.list)) S.news = all.news.list;
  if (all.companies && Array.isArray(all.companies.list)) S.companies = all.companies.list;
  if (all.feed){ S.feed = (all.feed.items || []).map(p => ({replies: [], ...p})); S.trends = all.feed.trends || []; S.trendsAt = all.feed.trendsAt || 0; S.tagCounts = all.feed.tagCounts || {}; }
  Object.keys(all).forEach(k => {
    const d = all[k];
    if (k.startsWith('av_') && d.src) S.photos[k.slice(3)] = d.src;
    else if (k.startsWith('u_') && d.key) U[d.key] = d;
    else if (k.startsWith('dm_') && d.key) S.dms[d.key] = d;
  });
  S.posts = Object.keys(all).filter(k => k.startsWith('p_')).map(k => ({...all[k], id: k})).sort((a, b) => b.time - a.time);
  if (!all.profile){ S.profile.joined = Date.now(); saveProfile(); }
  applyTheme(); if (!busy) render();
}
render();
(async () => {
  await Store.init();
  await loadAll();
  ensureSample();
  if (engine() === 'gemini' && !GEM.key()) setTimeout(() => toast('To play here, add your free Gemini key.', {label: 'Settings', fn: () => { sheet = {type: 'profile'}; renderSheet(); }}), 800);
})();
})();
